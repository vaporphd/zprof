# profiles/base/telemetry.yaml
# Core schema for .agentlog/dispatches.jsonl
# All projects write these fields; cross-project comparison uses only these.
version: 2

core_fields:
  # identity
  - {name: schema_version,      type: int,    required: true}
  - {name: harness,             type: string, required: true}  # "claude-code"
  - {name: harness_version,     type: string, required: true}  # e.g. "2.1.220"
  - {name: protocol_version,    type: string, required: false} # reserved for kimi etc
  - {name: machine_id,          type: string, required: true}
  - {name: project_id,          type: string, required: true}  # hash of root commit
  - {name: ts_utc,              type: string, required: true}  # ISO 8601 with offset

  # dispatch tree
  - {name: session_id,          type: string, required: true}
  - {name: dispatch_id,         type: string, required: true}  # <harness>:<session>:<native>
  - {name: seq,                 type: int,    required: true,  default: 0}
  - {name: parent_dispatch_id,  type: string, required: false}
  - {name: spawn_depth,         type: int,    required: true,  default: 1}

  # execution
  - {name: role,                type: string, required: true}
  - {name: overlay,             type: string, required: false}
  - {name: config_hash,         type: string, required: false}
  - {name: model_requested,     type: string, required: false}
  - {name: model_resolved,      type: string, required: false}

  # outcome
  - {name: verdict,             type: string, required: false} # first `verdict:` value from the return text (collector ≥ 0.2)
  - {name: status,              type: string, required: false}
  - {name: dispatch_complete,   type: bool,   required: true,  default: false}

  # cost (four fields — no totalTokens shortcut)
  - {name: tokens_input,        type: int,    required: false}
  - {name: tokens_output,       type: int,    required: false}
  - {name: tokens_cache_read,   type: int,    required: false}
  - {name: tokens_cache_creation, type: int,  required: false}
  - {name: tool_uses,           type: int,    required: false}
  - {name: duration_ms,         type: int,    required: false}

  # contract compliance (class A)
  - {name: artifact_exists,     type: bool,   required: false}
  - {name: has_preamble,        type: bool,   required: false}
  - {name: next_is_reachable,   type: bool,   required: false}
  - {name: return_parsed,       type: bool,   required: false}

  # provenance
  - {name: transcript_ref,      type: string, required: false}
  - {name: transcript_captured, type: bool,   required: true,  default: false}
  - {name: transcript_truncated,type: bool,   required: false}

  # extension
  - {name: ext,                 type: object, required: false}

redaction_patterns:
  - "AWS_[A-Z_]*=[^\\s]+"
  - "GITHUB_TOKEN=[^\\s]+"
  - "sk-[a-zA-Z0-9]{20,}"
  - "ghp_[a-zA-Z0-9]{36,}"
  - "Bearer [a-zA-Z0-9._\\-]+"
  - "-----BEGIN [A-Z ]+ PRIVATE KEY-----"
  - "password=[^\\s&]+"
  - "api_key=[^\\s&]+"

# --- tool-events.jsonl (collector ≥ 0.2, spec 2026-09-26-task-scorecard §5 C3) ---
# One row per leaf tool call inside a subagent transcript. Agent/Task calls are
# dispatches and live in dispatches.jsonl instead.
tool_events:
  - {name: schema_version,      type: int,    required: true}
  - {name: dispatch_id,         type: string, required: true}   # same composite id as dispatches.jsonl
  - {name: seq,                 type: int,    required: true}   # order inside the dispatch, from 1
  - {name: ts,                  type: string, required: false}  # timestamp of the tool_use record
  - {name: tool,                type: string, required: true}   # Read | Edit | Bash | Grep | ...
  - {name: input_hash,          type: string, required: true}   # sha1(canonical json input)[:12]
  - {name: target,              type: string, required: false}  # file_path | command[:60] | pattern, redacted
  - {name: is_error,            type: bool,   required: false}  # null when the tool_result never arrived
  - {name: mutating,            type: bool,   required: false}  # Bash only; computed on the full command
  - {name: result_chars,        type: int,    required: false}

# Bash commands that change files/state. Used by Go `zprof score` to decide
# whether a repeated failing command is a blind retry (P2) and whether a
# re-read (P3) is legitimate. Build/test/read commands are deliberately absent.
mutating_bash_patterns:
  - "\\s>>?\\s"
  - "\\bsed\\s+-i\\b"
  - "\\btee\\b"
  - "\\b(mv|cp|rm|touch|mkdir)\\b"
  # `ln` (symlink/hardlink) kept as its own pattern, not folded into the
  # mv|cp|rm|touch|mkdir family above: `\bln\b` (the issue #73's suggested
  # direction) false-positives on `ls -ln`, `sed -n 1,5p ln.go`, `python3
  # x.py --ln` -- a bare `\b` matches between a letter and any non-word char
  # including `-`/`.`. A negative-lookahead form (`ln(?!...)`) was also
  # tried and rejected: Go RE2 (`cli/internal/score/config.go`) silently
  # drops any pattern containing lookaround at compile time instead of
  # erroring, so the pattern would vanish from `zprof score` without
  # warning. This char-class form matches standalone `ln`/`/bin/ln`/`echo x;
  # ln a b` while sparing `ls -ln`/`readlink`/`ln.go`/`--ln` (residual
  # false-positive on e.g. `grep -n ln README.md` accepted -- same class as
  # the existing `mv|cp|rm` family's own `grep -n rm README.md`, out of
  # scope here, #73).
  - "(?:^|[^\\w.-])ln(?:$|[^\\w.-])"
  # Trailing `(?![\w-])` instead of a plain `\b`: a bare `\b` matches between
  # a letter and `-`, so `git merge-base`/`commit-tree`/`checkout-index`
  # matched as `merge`/`commit`/`checkout` and denied a read-only role's
  # legitimate read-only plumbing command (issue #75). `stash` is split into
  # its own pattern below (space-separated subcommands, not hyphenated —
  # mirrors guard.yaml `stash_in_worktree`, #75).
  - "\\bgit\\s+(commit|checkout|reset|apply|cherry-pick|merge|rebase)(?![\\w-])"
  # `git stash list`/`git stash show` are read-only; keep this negative
  # lookahead in sync with guard.yaml's own `stash_in_worktree` pattern.
  - "\\bgit\\s+stash\\b(?!\\s+(list|show))"
  - "\\bxcodegen\\b"
  - "\\b(cargo|go|swift)\\s+fmt\\b"
  - "\\b(gofmt\\s+-w|swiftformat|rustfmt)\\b"

# Bash commands excluded from P2 (blind-retry) scoring, matched after
# stripping one leading `rtk proxy `/`rtk ` wrapper prefix (mirrors
# zprof-guard.py `_RTK_PREFIXES`, ADR D7 §4). A `sleep`/`wait` used to poll
# an async-dispatched child (task-runner.md "Ожидание async-ребёнка") times
# out on the Bash tool's own 120s default when its duration exceeds that —
# that is timeout hygiene, not a blind retry of a failed command, and must
# not be scored as one (issue #53).
p2_exempt_patterns:
  - "^\\s*(sleep|wait)\\b"

# Roles whose contract does not start with `verdict:`. Empty since #20 (ADR
# 0003, docs/adr/0003-verdicts-registry.md): doctor now guarantees every
# role's return_format starts with `verdict:` (auditor/auditor-deep migrated
# off `completion:`), so P6/P7 no longer need to look away from these roles.
# The mechanism is kept for schema.json overrides on projects still running
# an older, unmigrated auditor.
verdict_exempt_roles: []

# Verdict words a reviewer uses to send work back to the implementer.
# P5 counts reviewer steps whose verdict is in this list. Mirrors
# verdicts.yaml: {t in roles.reviewer : base in {failed, blocked}}.
review_block_verdicts:
  - "block"
  - "changes-requested"
  - "awaiting-approval"
  - "failed"
  - "blocked"

# Defaults for `zprof score`; `.zprof.yaml: score:` overrides any key.
score_defaults:
  weights:    {P1: 20, P2: 15, P3: 10, P4: 20, P5: 10, P6: 15, P7: 10}
  saturation: {P1: 0.20, P2: 3, P3: 0.5, P4: 2, P5: 2, P6: 0.30, P7: 4}
  thresholds: {ideal: 85, solid: 60}
