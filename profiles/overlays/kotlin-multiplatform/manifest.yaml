name: kotlin-multiplatform
display_name: "Kotlin Multiplatform (Compose MP + Decompose + Koin + Ktor + SQLDelight; Android + iOS + Desktop + Web)"
version: 0.2.0
loop_template: dev-pipeline
requires_base: ">= 0.1.0"
roles:
  - architect
  - implementer
  - tester
  - bug-hunter
  - refactor-agent
  - explorer
  - reviewer
tool_agents:
  - gradle-runner
  - xcode-runner
  - adb-driver
  - emulator-driver
  - ktlint-checker
  - detekt-checker
  - init-kmp

stop_list:
  - "публикация в Play Console или App Store Connect"
  - "смена applicationId или bundle identifier"
  - "смена keystore и параметров подписи"
  - "ломающая смена публичного API общего модуля"
